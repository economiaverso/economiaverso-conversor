<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ee4d2d"
  >

  <title>Economiaverso | Conversor Shopee</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --shopee: #ee4d2d;
      --shopee-dark: #d83f22;
      --text: #161616;
      --muted: #727272;
      --line: #e9e9e9;
      --surface: #ffffff;
      --background: #f5f6f8;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: var(--background);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .topbar {
      width: 100%;
      height: 72px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.4px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--shopee);
      color: white;
      font-size: 20px;
      box-shadow:
        0 8px 20px
        rgba(238, 77, 45, 0.18);
    }

    main {
      width: 100%;
      padding: 56px 18px;
    }

    .hero {
      width: 100%;
      max-width: 650px;
      margin: 0 auto 24px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.08;
      letter-spacing: -1.4px;
    }

    .subtitle {
      max-width: 520px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .card {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow:
        0 20px 60px
        rgba(20, 20, 20, 0.06);
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 750;
    }

    .input {
      width: 100%;
      height: 60px;
      border: 1.5px solid #dddddd;
      border-radius: 14px;
      outline: none;
      padding: 0 16px;
      background: white;
      color: var(--text);
      font-size: 16px;
      transition:
        border-color .15s,
        box-shadow .15s;
    }

    .input:focus {
      border-color: var(--shopee);
      box-shadow:
        0 0 0 4px
        rgba(238, 77, 45, 0.09);
    }

    .primary {
      width: 100%;
      height: 58px;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      background: var(--shopee);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform .15s,
        background .15s,
        opacity .15s;
    }

    .primary:hover {
      background: var(--shopee-dark);
    }

    .primary:active {
      transform: scale(.99);
    }

    .primary:disabled {
      opacity: .58;
      cursor: wait;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 14px 15px;
      border-radius: 12px;
      background: #fff1ef;
      color: #b42318;
      font-size: 14px;
      line-height: 1.45;
    }

    .error.show {
      display: block;
    }

    .result {
      display: none;
      margin-top: 28px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .result.show {
      display: block;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      color: #18794e;
      font-size: 14px;
      font-weight: 750;
    }

    .success-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      background: #e8f7ef;
      border-radius: 50%;
    }

    .link-box {
      width: 100%;
      min-height: 60px;
      padding: 16px;
      display: flex;
      align-items: center;
      background: #f7f7f8;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      color: #242424;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-all;
      user-select: all;
    }

    .actions {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .action {
      min-height: 52px;
      border: 0;
      border-radius: 13px;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition:
        transform .15s,
        opacity .15s;
    }

    .action:active {
      transform: scale(.98);
    }

    .copy {
      background: #202124;
      color: white;
    }

    .open {
      background: var(--shopee);
      color: white;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 540px) {
      .topbar {
        height: 64px;
      }

      main {
        padding:
          36px
          12px
          30px;
      }

      .card {
        padding: 22px 16px;
        border-radius: 20px;
      }

      .subtitle {
        font-size: 15px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <span>Economiaverso</span>
    </div>
  </header>


  <main>

    <section class="hero">

      <h1>
        Conversor Shopee
      </h1>

      <p class="subtitle">
        Cole qualquer link da Shopee e gere
        automaticamente seu link de afiliado.
      </p>

    </section>


    <section class="card">

      <label for="linkOriginal">
        Link da Shopee
      </label>

      <input
        id="linkOriginal"
        class="input"
        type="text"
        inputmode="url"
        placeholder="Cole o link aqui"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >


      <button
        id="converter"
        class="primary"
        type="button"
      >
        Converter link
      </button>


      <div
        id="erro"
        class="error"
      ></div>


      <section
        id="resultado"
        class="result"
      >

        <div class="success">

          <span class="success-icon">
            ✓
          </span>

          <span>
            Link convertido com sucesso
          </span>

        </div>


        <div
          id="resultadoLink"
          class="link-box"
        ></div>


        <div class="actions">

          <button
            id="copiar"
            class="action copy"
            type="button"
          >
            Copiar link
          </button>


          <button
            id="abrir"
            class="action open"
            type="button"
          >
            Abrir na Shopee
          </button>

        </div>

      </section>


      <div class="footer-note">
        Seu AppID e Secret permanecem
        protegidos no servidor.
      </div>

    </section>

  </main>


  <script>
    const campo =
      document.getElementById(
        "linkOriginal"
      );

    const botaoConverter =
      document.getElementById(
        "converter"
      );

    const erro =
      document.getElementById(
        "erro"
      );

    const resultado =
      document.getElementById(
        "resultado"
      );

    const resultadoLink =
      document.getElementById(
        "resultadoLink"
      );

    const botaoCopiar =
      document.getElementById(
        "copiar"
      );

    const botaoAbrir =
      document.getElementById(
        "abrir"
      );


    let linkConvertido = "";


    function mostrarErro(
      mensagem
    ) {
      erro.textContent =
        mensagem;

      erro.classList.add(
        "show"
      );
    }


    function esconderErro() {
      erro.textContent = "";

      erro.classList.remove(
        "show"
      );
    }


    function extrairPrimeiraUrl(
      texto
    ) {
      const match =
        String(texto)
          .match(
            /https?:\/\/[^\s]+/i
          );

      return match
        ? match[0]
        : "";
    }


    async function converter() {

      esconderErro();

      resultado.classList.remove(
        "show"
      );

      linkConvertido = "";


      const url =
        extrairPrimeiraUrl(
          campo.value
        );


      if (!url) {
        mostrarErro(
          "Cole um link válido da Shopee."
        );

        return;
      }


      botaoConverter.disabled =
        true;

      botaoConverter.textContent =
        "Convertendo...";


      try {
        const resposta =
          await fetch(
            "/api/convert",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  url
                })
            }
          );


        let dados;

        try {
          dados =
            await resposta.json();

        } catch {
          throw new Error(
            "O servidor não retornou uma resposta válida."
          );
        }


        if (
          !resposta.ok ||
          !dados.ok
        ) {
          throw new Error(
            dados.erro ||
            "Não foi possível converter o link."
          );
        }


        if (!dados.afiliado) {
          throw new Error(
            "A Shopee não retornou o link de afiliado."
          );
        }


        linkConvertido =
          dados.afiliado;


        resultadoLink.textContent =
          linkConvertido;


        resultado.classList.add(
          "show"
        );


        resultado.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      } catch (e) {
        mostrarErro(
          e.message ||
          "Erro ao converter o link."
        );

      } finally {
        botaoConverter.disabled =
          false;

        botaoConverter.textContent =
          "Converter link";
      }
    }


    botaoConverter.addEventListener(
      "click",
      converter
    );


    campo.addEventListener(
      "keydown",
      evento => {
        if (
          evento.key ===
          "Enter"
        ) {
          evento.preventDefault();
          converter();
        }
      }
    );


    botaoCopiar.addEventListener(
      "click",
      async () => {
        if (!linkConvertido) {
          return;
        }

        try {
          await navigator
            .clipboard
            .writeText(
              linkConvertido
            );

          botaoCopiar.textContent =
            "Copiado ✓";

          setTimeout(
            () => {
              botaoCopiar.textContent =
                "Copiar link";
            },
            1400
          );

        } catch {
          const area =
            document.createElement(
              "textarea"
            );

          area.value =
            linkConvertido;

          area.style.position =
            "fixed";

          area.style.opacity =
            "0";

          document.body.appendChild(
            area
          );

          area.select();

          document.execCommand(
            "copy"
          );

          area.remove();

          botaoCopiar.textContent =
            "Copiado ✓";

          setTimeout(
            () => {
              botaoCopiar.textContent =
                "Copiar link";
            },
            1400
          );
        }
      }
    );


    botaoAbrir.addEventListener(
      "click",
      () => {
        if (!linkConvertido) {
          return;
        }

        /*
          Usamos o próprio link afiliado
          s.shopee.com.br.

          Em Android/iPhone, se o app da
          Shopee estiver associado a esses
          links, o sistema abre diretamente
          o aplicativo.

          Se não estiver, abre a Shopee
          pelo navegador sem perder o
          link de afiliado.
        */

        window.location.href =
          linkConvertido;
      }
    );
  </script>

</body>
</html>
