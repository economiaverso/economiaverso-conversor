<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Economiaverso - Conversor Shopee</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          135deg,
          #ff5a00,
          #ff7a00
        );
      min-height: 100vh;
      color: #222;
    }

    .pagina {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.22);
    }

    .logo {
      text-align: center;
      font-size: 52px;
      margin-bottom: 4px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 32px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-top: 10px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea,
    input {
      width: 100%;
      border: 2px solid #e7e7e7;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      outline: none;
      background: #fafafa;
      transition: 0.2s;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    textarea:focus,
    input:focus {
      border-color: #ff5a00;
      background: #fff;
    }

    .grupo {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #converter {
      background: #ff5a00;
      color: white;
      margin-top: 4px;
    }

    .resultado {
      display: none;
      margin-top: 28px;
      padding-top: 26px;
      border-top: 1px solid #eee;
    }

    .resultado.ativo {
      display: block;
    }

    .sucesso {
      background: #eaf9ee;
      color: #167a38;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 18px;
      text-align: center;
      font-weight: bold;
    }

    #resultadoLink {
      background: #f5f5f5;
      margin-bottom: 14px;
    }

    .acoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    #copiar {
      background: #222;
      color: white;
    }

    #abrirShopee {
      background: #ee4d2d;
      color: white;
    }

    .erro {
      display: none;
      background: #fff0f0;
      color: #b00020;
      padding: 14px;
      border-radius: 12px;
      margin-top: 18px;
      line-height: 1.4;
    }

    .erro.ativo {
      display: block;
    }

    .carregando {
      opacity: 0.75;
    }

    .rodape {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 28px;
    }

    @media (max-width: 520px) {
      .pagina {
        padding: 14px;
        align-items: flex-start;
      }

      .card {
        margin-top: 18px;
        padding: 24px 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 27px;
      }

      .acoes {
        grid-template-columns: 1fr;
      }

      button {
        min-height: 54px;
      }
    }
  </style>
</head>

<body>

  <div class="pagina">

    <main class="card">

      <div class="logo">🛍️</div>

      <h1>Economiaverso</h1>

      <div class="subtitulo">
        Cole qualquer link da Shopee e transforme
        automaticamente no seu link de afiliado.
      </div>


      <div class="grupo">

        <label for="linkOriginal">
          Link da Shopee
        </label>

        <textarea
          id="linkOriginal"
          placeholder="Cole aqui o link da Shopee..."
          autocomplete="off"
        ></textarea>

      </div>


      <div class="grupo">

        <label for="subId">
          Sub ID (opcional)
        </label>

        <input
          id="subId"
          type="text"
          placeholder="Ex.: instagram, whatsapp, telegram"
          autocomplete="off"
        />

      </div>


      <button id="converter">
        Converter link
      </button>


      <div
        id="erro"
        class="erro"
      ></div>


      <section
        id="resultadoArea"
        class="resultado"
      >

        <div class="sucesso">
          ✅ Link convertido com sucesso
        </div>


        <div class="grupo">

          <label for="resultadoLink">
            Seu link afiliado
          </label>

          <input
            id="resultadoLink"
            type="text"
            readonly
          />

        </div>


        <div class="acoes">

          <button id="copiar">
            📋 Copiar
          </button>

          <button id="abrirShopee">
            🛍️ Abrir na Shopee
          </button>

        </div>

      </section>


      <div class="rodape">
        Economiaverso • Conversor Shopee
      </div>

    </main>

  </div>


  <script>

    const linkOriginal =
      document.getElementById(
        "linkOriginal"
      );

    const subId =
      document.getElementById(
        "subId"
      );

    const converter =
      document.getElementById(
        "converter"
      );

    const resultadoArea =
      document.getElementById(
        "resultadoArea"
      );

    const resultadoLink =
      document.getElementById(
        "resultadoLink"
      );

    const copiar =
      document.getElementById(
        "copiar"
      );

    const abrirShopee =
      document.getElementById(
        "abrirShopee"
      );

    const erro =
      document.getElementById(
        "erro"
      );


    function mostrarErro(
      mensagem
    ) {

      erro.textContent =
        mensagem;

      erro.classList.add(
        "ativo"
      );

    }


    function esconderErro() {

      erro.textContent = "";

      erro.classList.remove(
        "ativo"
      );

    }


    function extrairPrimeiraUrl(
      texto
    ) {

      const match =
        String(texto)
          .match(
            /https?:\/\/[^\s]+/i
          );

      return match
        ? match[0]
        : "";
    }


    converter.addEventListener(
      "click",
      async () => {

        esconderErro();

        resultadoArea
          .classList.remove(
            "ativo"
          );


        const url =
          extrairPrimeiraUrl(
            linkOriginal.value
          );


        if (!url) {

          mostrarErro(
            "Cole um link válido da Shopee."
          );

          return;
        }


        converter.disabled =
          true;

        converter.textContent =
          "Convertendo...";

        converter.classList.add(
          "carregando"
        );


        try {

          const resposta =
            await fetch(
              "/api/convert",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    url:
                      url,

                    subId:
                      subId.value.trim()
                  })
              }
            );


          const dados =
            await resposta.json();


          if (
            !resposta.ok ||
            !dados.ok
          ) {

            throw new Error(
              dados.erro ||
              dados.error ||
              "Não foi possível converter o link."
            );
          }


          const linkFinal =
            dados.afiliado ||
            dados.shortLink ||
            dados.link ||
            dados.url;


          if (!linkFinal) {

            throw new Error(
              "A API não retornou o link convertido."
            );
          }


          resultadoLink.value =
            linkFinal;


          resultadoArea
            .classList.add(
              "ativo"
            );


          resultadoArea
            .scrollIntoView({
              behavior:
                "smooth",

              block:
                "center"
            });


        } catch (
          e
        ) {

          mostrarErro(
            e.message ||
            "Erro ao converter."
          );

        } finally {

          converter.disabled =
            false;

          converter.textContent =
            "Converter link";

          converter.classList.remove(
            "carregando"
          );

        }

      }
    );


    copiar.addEventListener(
      "click",
      async () => {

        const link =
          resultadoLink.value
            .trim();


        if (!link) {

          return;
        }


        try {

          await navigator
            .clipboard
            .writeText(
              link
            );


          copiar.textContent =
            "✅ Copiado";


          setTimeout(
            () => {

              copiar.textContent =
                "📋 Copiar";

            },
            1800
          );


        } catch {

          resultadoLink.select();

          document.execCommand(
            "copy"
          );

        }

      }
    );


    abrirShopee.addEventListener(
      "click",
      () => {

        const link =
          resultadoLink.value
            .trim();


        if (!link) {

          mostrarErro(
            "Converta um link primeiro."
          );

          return;
        }


        /*
          O link afiliado s.shopee.com.br
          utiliza os App Links/Universal Links
          da Shopee.

          Em Android/iPhone, se o app estiver
          instalado e configurado para abrir
          links da Shopee, o sistema deve abrir
          o aplicativo.

          Usamos a mesma aba para aumentar
          a chance de o sistema entregar o link
          ao aplicativo.
        */

        window.location.href =
          link;

      }
    );


    linkOriginal
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
              "Enter" &&
            (
              event.ctrlKey ||
              event.metaKey
            )
          ) {

            converter.click();

          }

        }
      );

  </script>

</body>
</html>
